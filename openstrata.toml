[project]
name = "usd-stage-runner"
version = "0.1.0"

[requires]
platform = "cy2026"
profile = "usd"

[build.intents.plugin-view]
cache = {
  USD_STAGE_RUNNER_OST_PLUGIN_BUNDLE_DIR = { type = "PATH", value = "plugins/runnerSchema", portability = "portable" }
}

[build.intents.plugin-view-jolt]
cache = {
  USD_STAGE_RUNNER_OST_PLUGIN_BUNDLE_DIR = { type = "PATH", value = "plugins/runnerSchema", portability = "portable" },
  USD_STAGE_RUNNER_REQUIRE_JOLT = { type = "BOOL", value = true }
}

[workspace]
members = [
  "libs/runtimeCore",
  "libs/inputCore",
  "libs/characterCore",
  "libs/cameraCore",
  "libs/vehicleCore",
  "libs/stageRuntime",
  "backends/inputSdl",
  "plugins/runnerSchema",
  "apps/stage_runner",
]
release_members = [
  "runtimeCore",
  "inputCore",
  "characterCore",
  "cameraCore",
  "vehicleCore",
  "stageRuntime",
  "inputSdl",
  "runnerSchema",
  "stage_runner",
]
