# Release workflow (hand-authored; its shape follows usd-motion-plugins'). The
# runtime and ost pins MIRROR openstrata.ci.yaml, which
# scripts/check_release_pins.py checks, because regenerating the pull request
# lanes never updates this file and a green pull request says nothing about it.
#
# Pushing a tag `vX.Y.Z` -- equal to VERSION, with a dated CHANGELOG section --
# builds and verifies the libraries, the runnerSchema bundle and the stage_runner
# tool on Windows and Linux, pushes each to ghcr.io/animu-sphere/usd-stage-runner
# tagged `<member>-<version>-<target>`, generates the consumer pin table from the
# push results and assembles a DRAFT GitHub release. Publishing the draft is a
# human decision.
#
# The Jolt SDK is the one this repository's source CI builds. The physics pins in
# the descriptors record its compile definitions, and physicsJolt refuses any other
# SDK at configure.
#
# `workflow_dispatch` is a dry run: the same lanes, uploaded as workflow artifacts,
# with no registry write and no release object.
#
# Fork safety: runs only on a tag push or a manual dispatch, never on
# pull_request; only the publish job's token can write packages and only the
# release job's can write contents.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  OCI_REPOSITORY: "ghcr.io/animu-sphere/usd-stage-runner"

jobs:
  preflight:
    name: preflight (tag = VERSION, changelog finalized)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$file_version" ]; then
              echo "::error title=release preflight::tag ${GITHUB_REF_NAME} does not match VERSION ($file_version)" ; exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$file_version" >> "$GITHUB_OUTPUT"
      - name: Check this workflow mirrors the CI contract
        run: python3 scripts/check_release_pins.py
      - name: Check the changelog section renders (finalized on a real release)
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ steps.version.outputs.is_release }}" != "true" ]; then
            extra="--allow-unreleased"
          fi
          python3 scripts/make_release_notes.py --version "${{ steps.version.outputs.version }}" $extra > /dev/null

  build:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.runs_on }}
    env:
      OST_HOME: ${{ format('{0}/.ost-ci-home', github.workspace) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release-windows
            runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf"
            platform: cy2026
            profile: usd
            runs_on: ["windows-2025-vs2026"]
            host_python: "3.13"
          - name: release-linux
            runtime_artifact: sha256:3bf31789daa60ef650df35ab276bd67d0c0ee44a960311f78835cc0962efe261
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f"
            platform: cy2026
            profile: usd
            runs_on: ["ubuntu-24.04"]
            host_python: "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out pinned Jolt Physics 5.5.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: jrouwe/JoltPhysics
          ref: 23dadd0e603f1b321142d4c74df07fce85064989
          path: .ci/jolt
      - name: Install X11 dev headers required by MaterialX 1.39.5
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libx11-dev libxt-dev
      - name: Build and install the Jolt SDK the physics pins expect
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/.ci/jolt-install"
          configure=(
            -S .ci/jolt/Build
            -B .ci/jolt-build
            "-DCMAKE_INSTALL_PREFIX=$prefix"
            -DCMAKE_BUILD_TYPE=Release
            -DINTERPROCEDURAL_OPTIMIZATION=OFF
            -DDOUBLE_PRECISION=OFF
            -DCROSS_PLATFORM_DETERMINISTIC=OFF
            -DENABLE_ALL_WARNINGS=OFF
            -DGENERATE_DEBUG_SYMBOLS=OFF
            -DUSE_STATIC_MSVC_RUNTIME_LIBRARY=OFF
            -DTARGET_UNIT_TESTS=OFF
            -DTARGET_HELLO_WORLD=OFF
            -DTARGET_PERFORMANCE_TEST=OFF
            -DTARGET_SAMPLES=OFF
            -DTARGET_VIEWER=OFF
          )
          # Mirrors the source CI: each of these changes what Jolt::Jolt exports.
          if [ "$RUNNER_OS" = "Windows" ]; then
            configure+=(
              -A x64
              -DDEBUG_RENDERER_IN_DEBUG_AND_RELEASE=ON
              -DPROFILER_IN_DEBUG_AND_RELEASE=ON
              -DUSE_SSE4_1=OFF -DUSE_SSE4_2=OFF
              -DUSE_AVX=OFF -DUSE_AVX2=OFF -DUSE_AVX512=OFF
              -DUSE_LZCNT=OFF -DUSE_TZCNT=OFF
              -DUSE_F16C=OFF -DUSE_FMADD=OFF
            )
          else
            configure+=(
              -DDEBUG_RENDERER_IN_DEBUG_AND_RELEASE=OFF
              -DPROFILER_IN_DEBUG_AND_RELEASE=OFF
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            )
          fi
          cmake "${configure[@]}"
          cmake --build .ci/jolt-build --config Release --target Jolt
          cmake --install .ci/jolt-build --config Release
          if [ "$RUNNER_OS" = "Windows" ]; then
            prefix="$(cygpath -w "$prefix")"
          fi
          echo "JOLT_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Bootstrap ost 0.23.1 (pinned release asset, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   triple=x86_64-unknown-linux-musl ; ext=tar.xz ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ; ext=zip ;;
            *) echo "::error title=ost bootstrap::no release cell for ${RUNNER_OS}-${RUNNER_ARCH}" ; exit 1 ;;
          esac
          asset="ost-cli-${triple}.${ext}"
          base="https://github.com/animu-sphere/open-strata/releases/download/v0.23.1"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo "$asset.sha256" "$base/$asset.sha256"
          actual="$(sha256sum "$asset" | cut -d' ' -f1)"
          published="$(cut -d' ' -f1 "$asset.sha256")"
          if [ "$actual" != "$published" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the release publishes $published" ; exit 1
          fi
          mkdir -p .ost-ci/bootstrap-bin
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$asset' -DestinationPath '.ost-ci/bootstrap-bin' -Force"
          else
            tar -xf "$asset" -C .ost-ci/bootstrap-bin
          fi
          bin="$(find .ost-ci/bootstrap-bin -type f \( -name ost -o -name ost.exe \) | head -n 1)"
          if [ -z "$bin" ]; then echo "::error title=ost bootstrap::no ost binary inside $asset" ; exit 1 ; fi
          chmod +x "$bin" 2> /dev/null || true
          bindir="$(cd "$(dirname "$bin")" && pwd)"
          # GITHUB_PATH must hold a native path for Windows processes.
          if command -v cygpath > /dev/null; then bindir="$(cygpath -w "$bindir")"; fi
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Check ost is available
        shell: bash
        run: |
          set -euo pipefail
          version="$(ost --version)"
          echo "$version"
          if [ "$version" != "ost 0.23.1" ]; then
            echo "::error title=ost bootstrap::expected 'ost 0.23.1', got '$version'" ; exit 1
          fi
      - name: Pull, verify and materialize the pinned runtime SDK
        shell: bash
        run: |
          set -euo pipefail
          ost artifact pull "${{ matrix.runtime_remote }}" --expect-artifact "${{ matrix.runtime_artifact }}" --require-kind runtime --json
          ost artifact verify ${{ matrix.runtime_artifact }} --minimum-trust local --require-sbom --require-provenance
          ost runtime pull ${{ matrix.platform }} --profile ${{ matrix.profile }} --from-artifact ${{ matrix.runtime_artifact }} --force
      - name: Pull digest-pinned external library artifacts
        shell: pwsh
        run: |
          $result = ost library pull --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --json |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefixes = @($result.data.libraries | ForEach-Object { $_.prefix })
          if ($prefixes.Count -eq 0) {
            throw "OpenStrata did not materialize any external library prefixes"
          }
          "OST_EXTERNAL_LIBRARY_PREFIXES=$($prefixes -join [IO.Path]::PathSeparator)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up host Python matching the runtime ABI
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.host_python }}
      - name: Validate the materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          ost runtime validate ${{ matrix.platform }} --profile ${{ matrix.profile }} --json | tee .ost-ci/runtime-validate.json
      # Root first, bundle second: the root build rewrites the bundle's lib/ without
      # bundle-managed provenance, so the other order fails packaging closed.
      - name: Build the workspace root tree
        shell: pwsh
        run: |
          $env:CMAKE_PREFIX_PATH = @($env:OST_EXTERNAL_LIBRARY_PREFIXES, $env:JOLT_PREFIX, $env:CMAKE_PREFIX_PATH) |
            Where-Object { $_ } | Join-String -Separator ([IO.Path]::PathSeparator)
          ost build --target ${{ matrix.platform }} --profile ${{ matrix.profile }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the root suite
        shell: pwsh
        run: |
          $env:CMAKE_PREFIX_PATH = @($env:OST_EXTERNAL_LIBRARY_PREFIXES, $env:JOLT_PREFIX, $env:CMAKE_PREFIX_PATH) |
            Where-Object { $_ } | Join-String -Separator ([IO.Path]::PathSeparator)
          ost test --target ${{ matrix.platform }} --profile ${{ matrix.profile }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, verify and package the bundle and tool
        shell: pwsh
        run: |
          $env:CMAKE_PREFIX_PATH = @($env:OST_EXTERNAL_LIBRARY_PREFIXES, $env:JOLT_PREFIX, $env:CMAKE_PREFIX_PATH) |
            Where-Object { $_ } | Join-String -Separator ([IO.Path]::PathSeparator)
          ost plugin build plugins/runnerSchema --target ${{ matrix.platform }} --profile ${{ matrix.profile }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ost plugin test --workspace --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --up-to 5 --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ost plugin package --workspace --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --json | Out-File -Encoding utf8NoBOM .ost-ci/package.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, test and package every library, twice
        shell: pwsh
        run: |
          $env:CMAKE_PREFIX_PATH = @($env:OST_EXTERNAL_LIBRARY_PREFIXES, $env:JOLT_PREFIX, $env:CMAKE_PREFIX_PATH) |
            Where-Object { $_ } | Join-String -Separator ([IO.Path]::PathSeparator)
          $common = @('--target', '${{ matrix.platform }}', '--profile', '${{ matrix.profile }}')
          foreach ($library in 'libs/runtimeCore', 'libs/inputCore', 'libs/characterCore', 'libs/cameraCore', 'libs/vehicleCore', 'libs/stageRuntime', 'backends/inputSdl') {
            $name = Split-Path $library -Leaf
            ost library build $library @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ost library test $library @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ost library package $library @common --json | Out-File -Encoding utf8NoBOM ".ost-ci/$name.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ost library package $library @common --json | Out-File -Encoding utf8NoBOM ".ost-ci/$name-second.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $first = (Get-Content ".ost-ci/$name.json" -Raw | ConvertFrom-Json).data.archive_digest
            $second = (Get-Content ".ost-ci/$name-second.json" -Raw | ConvertFrom-Json).data.archive_digest
            if (-not $first -or $first -ne $second) {
              Write-Output "::error title=release packaging::two packagings of $name disagree ($first, $second)"
              exit 1
            }
          }
      # Standard physics stays opt-in, so its CMake and OpenStrata paths are not
      # covered by the suites above.
      - name: Validate standard and compatibility physics in CMake and OpenStrata
        shell: pwsh
        run: >-
          ./tests/run_physics_usd_ci.ps1
          -Target ${{ matrix.platform }} -Profile ${{ matrix.profile }}
      - name: Stage the release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          mkdir -p release-stage/packages
          for name in runtimeCore inputCore characterCore cameraCore vehicleCore stageRuntime inputSdl; do
            json=".ost-ci/$name.json"
            archive="$(jq -er '.data.archive' "$json")"
            digest="$(jq -er '.data.archive_digest' "$json")"
            target="$(jq -er '.data.target' "$json")"
            got="$(jq -er '.data.library.version' "$json")"
            if [ "$got" != "$version" ]; then
              echo "::error title=release packaging::$name packaged version $got but the release is $version" ; exit 1
            fi
            if command -v cygpath > /dev/null; then archive="$(cygpath -u "$archive")"; fi
            dist_dir="$(dirname "$archive")"
            mkdir -p "release-stage/packages/$name"
            cp -R "$dist_dir/." "release-stage/packages/$name/"
            cp "$archive" release-stage/
            cp "$dist_dir/manifest.json" "release-stage/$name-$version-$target.manifest.json"
            printf 'library\t%s\t%s\t%s\t%s\n' "$name" "$version" "$target" "$digest" >> release-stage/member-digests.tsv
          done
          # The bundle and the tool, counted from the tree: a member that stops being
          # packaged must fail here rather than quietly not ship.
          bundles="$(jq -er '[.data.packages[] | select(.member == "bundle")] | length' .ost-ci/package.json)"
          tools="$(jq -er '[.data.packages[] | select(.member == "tool")] | length' .ost-ci/package.json)"
          want_bundles="$(find plugins -name openstrata.plugin.yaml -not -path '*/.strata/*' | wc -l | tr -d ' ')"
          want_tools="$(find apps -name openstrata.tool.yaml -not -path '*/.strata/*' | wc -l | tr -d ' ')"
          if [ "$bundles" -ne "$want_bundles" ] || [ "$tools" -ne "$want_tools" ]; then
            echo "::error title=release packaging::the tree declares $want_bundles bundle(s) and $want_tools tool(s), packaging produced $bundles and $tools" ; exit 1
          fi
          count="$(jq -er '.data.packages | length' .ost-ci/package.json)"
          for i in $(seq 0 $((count - 1))); do
            member="$(jq -er ".data.packages[$i].member" .ost-ci/package.json)"
            case "$member" in bundle|tool) ;; *) continue ;; esac
            name="$(jq -er ".data.packages[$i].name" .ost-ci/package.json)"
            archive="$(jq -er ".data.packages[$i].archive" .ost-ci/package.json)"
            target="$(jq -er ".data.packages[$i].target" .ost-ci/package.json)"
            digest="$(jq -er ".data.packages[$i].archive_digest" .ost-ci/package.json)"
            got="$(jq -er ".data.packages[$i].version" .ost-ci/package.json)"
            if [ "$got" != "$version" ]; then
              echo "::error title=release packaging::$name packaged version $got but the release is $version" ; exit 1
            fi
            if command -v cygpath > /dev/null; then archive="$(cygpath -u "$archive")"; fi
            dist_dir="$(dirname "$archive")"
            mkdir -p "release-stage/packages/$name"
            cp -R "$dist_dir/." "release-stage/packages/$name/"
            cp "$archive" release-stage/
            cp "$dist_dir/manifest.json" "release-stage/$name-$version-$target.manifest.json"
            printf '%s\t%s\t%s\t%s\t%s\n' "$member" "$name" "$version" "$target" "$digest" >> release-stage/member-digests.tsv
          done
          ls -l release-stage
      - name: Upload the evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-${{ matrix.name }}
          include-hidden-files: true
          path: .ost-ci/
          if-no-files-found: warn
      - name: Upload the staged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: release-stage/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the artifacts
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      OST_HOME: ${{ format('{0}/.ost-ci-home', github.workspace) }}
      # `ost` does not read the docker credential store; a push needs user + password.
      OST_REGISTRY_USER: ${{ github.actor }}
      OST_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download the per-target artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: staged
      - name: Bootstrap ost 0.23.1 (pinned release asset, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          asset="ost-cli-x86_64-unknown-linux-musl.tar.xz"
          base="https://github.com/animu-sphere/open-strata/releases/download/v0.23.1"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo "$asset.sha256" "$base/$asset.sha256"
          actual="$(sha256sum "$asset" | cut -d' ' -f1)"
          published="$(cut -d' ' -f1 "$asset.sha256")"
          if [ "$actual" != "$published" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the release publishes $published" ; exit 1
          fi
          mkdir -p .ost-ci/bootstrap-bin
          tar -xf "$asset" -C .ost-ci/bootstrap-bin
          bin="$(find .ost-ci/bootstrap-bin -type f -name ost | head -n 1)"
          chmod +x "$bin"
          echo "$(cd "$(dirname "$bin")" && pwd)" >> "$GITHUB_PATH"
      - name: Import every artifact into the local registry
        shell: bash
        run: |
          set -euo pipefail
          for dir in staged/*/packages/*; do
            [ -f "$dir/manifest.json" ] || { echo "::error title=publish::$dir has no manifest.json" ; exit 1 ; }
            ost artifact import "$dir" --json > /dev/null
          done
          mkdir -p .ost-ci
          cat staged/*/member-digests.tsv | sort -u > .ost-ci/artifacts.tsv
          cat .ost-ci/artifacts.tsv
      - name: Push each artifact to the OCI repository
        if: ${{ needs.preflight.outputs.is_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          : > .ost-ci/pushed.tsv
          while IFS=$'\t' read -r kind name ver target digest; do
            tag="${name}-${ver}-${target}"
            out=".ost-ci/push-${tag}.json"
            ost artifact push "$digest" "oci://${OCI_REPOSITORY}:${tag}" --json > "$out" < /dev/null
            oci="$(jq -er '.data.oci_digest' "$out")"
            art="$(jq -er '.data.artifact_digest' "$out")"
            if [ "$art" != "$digest" ]; then
              echo "::error title=publish::pushing $tag reported artifact digest $art, expected $digest" ; exit 1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$kind" "$name" "$ver" "$target" "$digest" "$oci" >> .ost-ci/pushed.tsv
            echo "pushed $tag -> $oci"
          done < .ost-ci/artifacts.tsv
      - name: Build the consumer pin table
        shell: bash
        run: |
          set -euo pipefail
          rows=.ost-ci/artifacts.tsv
          published=""
          if [ "${{ needs.preflight.outputs.is_release }}" = "true" ]; then
            rows=.ost-ci/pushed.tsv
            published="--published"
          fi
          want_libraries="$(find libs backends -name openstrata.library.yaml -not -path '*/.strata/*' | wc -l | tr -d ' ')"
          want_bundles="$(find plugins -name openstrata.plugin.yaml -not -path '*/.strata/*' | wc -l | tr -d ' ')"
          want_tools="$(find apps -name openstrata.tool.yaml -not -path '*/.strata/*' | wc -l | tr -d ' ')"
          want_targets="$(ls -d staged/release-* | wc -l | tr -d ' ')"
          python3 scripts/make_library_pins.py --rows "$rows" \
            --version "${{ needs.preflight.outputs.version }}" \
            --repository "${OCI_REPOSITORY}" --targets "$want_targets" \
            --want "library=$want_libraries" --want "bundle=$want_bundles" --want "tool=$want_tools" --out out $published
          cat out/external-library-pins.md
      - name: Upload the pin table
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pins
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    name: assemble release (draft)
    needs: [preflight, build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download the per-target artifacts and the pin table
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: staged
      - name: Collect the release files
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          mkdir -p dist-release
          # Only the flat files: `packages/` holds the import directories the
          # publish job consumed, and their archives are already here.
          find staged -maxdepth 2 -type f \( -name '*.tar.zst' -o -name '*.manifest.json' \) -exec cp {} dist-release/ \;
          cp staged/pins/external-library-pins.* dist-release/
          git archive --format=tar.gz --prefix="usd-stage-runner-$version/" \
            -o "dist-release/usd-stage-runner-$version-src.tar.gz" HEAD
      - name: Write SHA256SUMS over every release file
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS
          cat SHA256SUMS
      - name: Render the release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ needs.preflight.outputs.is_release }}" != "true" ]; then
            extra="--allow-unreleased"
          fi
          python3 scripts/make_release_notes.py \
            --version "${{ needs.preflight.outputs.version }}" \
            --pins dist-release/external-library-pins.md \
            --checksums dist-release/SHA256SUMS \
            --out release-notes.md $extra
      - name: Create the draft GitHub release
        if: ${{ needs.preflight.outputs.is_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "usd-stage-runner ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist-release/*
      - name: Upload the dry-run bundle (workflow_dispatch only)
        if: ${{ needs.preflight.outputs.is_release != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dry-run-release
          path: |
            dist-release/
            release-notes.md
          if-no-files-found: error
          retention-days: 7
