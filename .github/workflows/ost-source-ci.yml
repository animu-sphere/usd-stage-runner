# Generated by `ost ci generate github` from openstrata.ci.yaml.
# Regenerate after editing the matrix; do not edit the jobs by hand.
#
# Source CI: each job checks out the repo, obtains a digest-pinned runtime
# SDK artifact, and builds/tests/packages the bundle from source. On
# GitHub-hosted runners the job bootstraps a pinned, checksum-verified `ost`
# and pulls the runtime from the cell's remote (oci://) reference — an
# actions/cache restore keyed by digest is a speed optimization, never a
# correctness precondition. Self-hosted runners keep their operator-managed
# `ost` and registry (air-gapped local import stays supported).
#
# Fork-PR safety: this workflow never publishes, never promotes, and uses no
# secrets; keep it that way when editing the matrix.
#
# Repository adjustments retained after regeneration:
# - OpenStrata 0.22.x emits a plugin-only graph command for every workspace
#   cell. Skip it until this library/tool-only workspace contains a plugin.
# - Build pinned Jolt beside the pinned USD runtime and run the root CMake
#   integration tests so the combined OpenUSD + real-Jolt path cannot be
#   silently skipped by the component-oriented workspace build.
name: ost source ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-workspace:
    if: github.event_name == 'pull_request'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    env:
      OST_CI_CELL: ${{ matrix.name }}
      OST_CI_LANE: ${{ matrix.lane }}
      OST_CI_RUNNER_PROFILE: ${{ matrix.runner_profile }}
      OST_CI_RUNS_ON: ${{ join(matrix.runs_on, ',') }}
      OST_CI_RUNTIME_ARTIFACT: ${{ matrix.runtime_artifact }}
      OST_CI_MINIMUM_TRUST: ${{ matrix.minimum_trust }}
      OST_HOME: ${{ matrix.hosted && format('{0}/.ost-ci-home', github.workspace) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace-pr-windows
            lane: pull_request
            runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
            target_trust: local
            minimum_trust: local
            require_evidence: all
            evidence_flags: "--require-sbom --require-provenance"
            platform: cy2026
            profile: usd
            runs_on: ["windows-2022"]
            hosted: true
            runner_profile: windows-hosted
            verify: test
            runtime_remote: "oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf"
            host_python: "3.13"
            host_packages_apt: ""
            host_packages_brew: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out Jolt Physics 5.5.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: jrouwe/JoltPhysics
          ref: 23dadd0e603f1b321142d4c74df07fce85064989
          path: .ci/jolt
      - name: Hosted runner billing notice
        if: ${{ matrix.hosted }}
        shell: bash
        run: echo "::notice title=OpenStrata hosted-runner usage::This job uses GitHub-hosted infrastructure. Private repositories may incur GitHub Actions usage charges. Review repository billing and Actions usage settings."
      - name: Bootstrap ost 0.22.6 (pinned release asset, checksum-verified)
        if: ${{ matrix.hosted }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   triple=x86_64-unknown-linux-musl ; ext=tar.xz ;;
            macOS-ARM64) triple=aarch64-apple-darwin ; ext=tar.xz ;;
            macOS-X64)   triple=x86_64-apple-darwin ; ext=tar.xz ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ; ext=zip ;;
            *) echo "::error title=ost bootstrap::no ost release asset for ${RUNNER_OS}-${RUNNER_ARCH}" ; exit 1 ;;
          esac
          pinned=""
          case "$triple" in
            *) : ;;
          esac
          asset="ost-cli-${triple}.${ext}"
          base="https://github.com/animu-sphere/open-strata/releases/download/v0.22.6"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo "$asset.sha256" "$base/$asset.sha256"
          actual="$( (command -v sha256sum > /dev/null && sha256sum "$asset" || shasum -a 256 "$asset") | cut -d' ' -f1 )"
          published="$(cut -d' ' -f1 "$asset.sha256")"
          if [ "$actual" != "$published" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the release publishes $published" ; exit 1
          fi
          if [ -n "$pinned" ] && [ "$actual" != "$pinned" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the CI contract pins $pinned" ; exit 1
          fi
          mkdir -p .ost-ci/bootstrap-bin
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$asset' -DestinationPath '.ost-ci/bootstrap-bin' -Force"
          else
            tar -xf "$asset" -C .ost-ci/bootstrap-bin
          fi
          bin="$(find .ost-ci/bootstrap-bin -type f \( -name ost -o -name ost.exe \) | head -n 1)"
          if [ -z "$bin" ]; then echo "::error title=ost bootstrap::no ost binary inside $asset" ; exit 1 ; fi
          chmod +x "$bin" 2> /dev/null || true
          bin_dir="$(cd "$(dirname "$bin")" && pwd)"
          bin="$bin_dir/$(basename "$bin")"
          executable="$bin"
          exported_path="$bin_dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            if ! command -v cygpath > /dev/null; then
              echo "::error title=ost bootstrap::cygpath is required to export a native Windows PATH" ; exit 1
            fi
            executable="$(cygpath -w "$bin")"
            exported_path="$(cygpath -w "$bin_dir")"
          fi
          echo "$exported_path" >> "$GITHUB_PATH"
          json_executable="$(printf '%s' "$executable" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          json_exported_path="$(printf '%s' "$exported_path" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          printf '{"schema":1,"pinned_version":"%s","asset":"%s","sha256":"%s","executable":"%s","exported_path":"%s"}\n' "0.22.6" "$asset" "$actual" "$json_executable" "$json_exported_path" > .ost-ci/bootstrap.json
      - name: Check ost is available and record its version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          if [ "${{ matrix.hosted }}" = "true" ] && [ "$RUNNER_OS" = "Windows" ]; then
            version="$(powershell -NoProfile -Command "& ost.exe --version" | tr -d '\r')"
          else
            version="$(ost --version)"
          fi

          echo "$version"
          if [ "${{ matrix.hosted }}" = "true" ] && [ "$version" != "ost 0.22.6" ]; then
            echo "::error title=ost bootstrap::expected 'ost 0.22.6', got '$version'" ; exit 1
          fi
          printf '{"schema":1,"ost_version":"%s"}\n' "$version" > .ost-ci/ost-version.json
      - name: Validate the CI manifest
        shell: bash
        run: ost ci validate
      - name: Restore the artifact registry cache (speed only, never correctness)
        id: runtime-cache-restore
        if: ${{ matrix.hosted && vars.OST_CI_DISABLE_CACHE != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-0.22.6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ matrix.runtime_artifact }}
      - name: Pull the pinned runtime SDK from its remote reference
        if: ${{ matrix.runtime_remote != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          if ost artifact show "${{ matrix.runtime_artifact }}" --json > /dev/null 2>&1 \
             && ost artifact verify "${{ matrix.runtime_artifact }}" ${{ matrix.evidence_flags }} --json > .ost-ci/runtime-cache-verify.json; then
            echo "pinned runtime already present and verified (cache hit) -- skipping the remote pull"
          else
            if [ "${{ matrix.hosted }}" = "true" ] && [ -n "${OST_HOME:-}" ]; then
              rm -rf "${OST_HOME}/artifacts"
            fi
            ost artifact pull "${{ matrix.runtime_remote }}" --expect-artifact "${{ matrix.runtime_artifact }}" --require-kind runtime --json | tee .ost-ci/runtime-pull.json
          fi
      - name: Verify and materialize the pinned runtime SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          printf '{"schema":1,"runtime_artifact":"%s","source":"%s"}\n' "${{ matrix.runtime_artifact }}" "${{ matrix.runtime_remote != '' && 'remote-pull' || 'local-registry' }}" > .ost-ci/runtime-source.json
          ost artifact verify ${{ matrix.runtime_artifact }} --minimum-trust ${{ matrix.minimum_trust }} ${{ matrix.evidence_flags }}
          ost runtime pull ${{ matrix.platform }} --profile ${{ matrix.profile }} --from-artifact ${{ matrix.runtime_artifact }} --force
      - name: Remove resumable transfer state before caching
        if: ${{ matrix.hosted && vars.OST_CI_DISABLE_CACHE != 'true' && steps.runtime-cache-restore.outputs.cache-hit != 'true' }}
        shell: bash
        run: rm -rf .ost-ci-home/artifacts/.partial-blobs
      - name: Save the verified artifact registry cache
        if: ${{ matrix.hosted && vars.OST_CI_DISABLE_CACHE != 'true' && steps.runtime-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-0.22.6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ matrix.runtime_artifact }}
      - name: Set up host Python for schema tooling
        if: ${{ matrix.hosted && matrix.host_python != '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.host_python }}
      - name: Record the schema-tooling Python contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          if [ "${{ matrix.hosted }}" = "true" ] && [ -n "${{ matrix.host_python }}" ]; then
            source=host-setup-python
          elif [ -n "${{ matrix.host_python }}" ]; then
            source=operator-provisioned
          else
            source=runtime-bundled
          fi
          printf '{"schema":1,"host_python":"%s","source":"%s"}\n' "${{ matrix.host_python }}" "$source" > .ost-ci/python-setup.json
      - name: Validate the materialized runtime (runnable tools)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          ost runtime validate ${{ matrix.platform }} --profile ${{ matrix.profile }} --json | tee .ost-ci/runtime-validate.json
      - name: Build and install Jolt Physics for the vertical slice
        shell: pwsh
        run: |
          $joltPrefix = Join-Path $env:GITHUB_WORKSPACE ".ci/jolt-install"
          cmake -S .ci/jolt/Build -B .ci/jolt-build -A x64 `
            -DCMAKE_INSTALL_PREFIX="$joltPrefix" `
            -DINTERPROCEDURAL_OPTIMIZATION=OFF `
            -DENABLE_ALL_WARNINGS=OFF `
            -DGENERATE_DEBUG_SYMBOLS=OFF `
            -DDEBUG_RENDERER_IN_DEBUG_AND_RELEASE=OFF `
            -DPROFILER_IN_DEBUG_AND_RELEASE=OFF `
            -DUSE_STATIC_MSVC_RUNTIME_LIBRARY=OFF `
            -DTARGET_UNIT_TESTS=OFF `
            -DTARGET_HELLO_WORLD=OFF `
            -DTARGET_PERFORMANCE_TEST=OFF `
            -DTARGET_SAMPLES=OFF `
            -DTARGET_VIEWER=OFF
          cmake --build .ci/jolt-build --config Release --target Jolt
          cmake --install .ci/jolt-build --config Release
          "JOLT_PREFIX=$joltPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure the combined OpenUSD and Jolt integration build
        shell: pwsh
        run: |
          $runtime = (& ost env ${{ matrix.platform }} --profile ${{ matrix.profile }} --json | ConvertFrom-Json).data
          $pythonExecutable = (Get-Command python).Source
          $pythonLibrary = Get-ChildItem (Join-Path $env:Python_ROOT_DIR "libs") -Filter "python3??.lib" | Select-Object -First 1 -ExpandProperty FullName
          $pythonInclude = Join-Path $env:Python_ROOT_DIR "Include"

          foreach ($path in @($pythonExecutable, $pythonLibrary, $pythonInclude)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Python Development artifact is missing: $path"
            }
          }

          # The published runtime has the producer's Python include directory
          # embedded in its imported targets. Repair only that exact, absent
          # path in the materialized copy; pulling the runtime again restores it.
          $pxrConfig = Join-Path $runtime.prefix "pxrConfig.cmake"
          $pxrTargets = Join-Path $runtime.prefix "cmake/pxrTargets.cmake"
          $configText = Get-Content -LiteralPath $pxrConfig -Raw
          $bakedMatch = [regex]::Match($configText, 'set\(Python3_INCLUDE_DIR \[\[(.+?)\]\]\)')
          if (-not $bakedMatch.Success) {
            throw "pxrConfig.cmake does not expose its baked Python include directory"
          }
          $bakedInclude = $bakedMatch.Groups[1].Value
          if (-not (Test-Path -LiteralPath $bakedInclude)) {
            $replacement = $pythonInclude.Replace('\', '/')
            $targetsText = Get-Content -LiteralPath $pxrTargets -Raw
            $updatedTargets = $targetsText.Replace($bakedInclude, $replacement).Replace($bakedInclude.Replace('\', '/'), $replacement)
            if ($updatedTargets -eq $targetsText) {
              throw "pxrTargets.cmake does not contain the absent producer path: $bakedInclude"
            }
            [System.IO.File]::WriteAllText($pxrTargets, $updatedTargets, [System.Text.UTF8Encoding]::new($false))
          }

          Invoke-Expression ((& ost env ${{ matrix.platform }} --profile ${{ matrix.profile }} --shell pwsh) -join "`n")
          $env:CMAKE_PREFIX_PATH = "$env:JOLT_PREFIX;$($runtime.prefix);$env:CMAKE_PREFIX_PATH"
          cmake -S . -B build/vertical-slice -A x64 `
            -DBUILD_TESTING=ON `
            -DUSD_STAGE_RUNNER_BUILD_APP=ON `
            -DUSD_STAGE_RUNNER_REQUIRE_OPENUSD=ON `
            -DUSD_STAGE_RUNNER_REQUIRE_JOLT=ON `
            "-Dpxr_DIR=$($runtime.prefix)" `
            "-DJolt_DIR=$(Join-Path $env:JOLT_PREFIX 'lib/cmake/Jolt')" `
            "-DPython3_EXECUTABLE=$pythonExecutable" `
            "-DPython3_LIBRARY=$pythonLibrary" `
            "-DPython3_INCLUDE_DIR=$pythonInclude" `
            "-DMaterialX_DIR=$(Join-Path $runtime.prefix 'lib/cmake/MaterialX')" `
            "-DOpenSubdiv_DIR=$(Join-Path $runtime.prefix 'lib/cmake/OpenSubdiv')" `
            "-DTBB_DIR=$(Join-Path $runtime.prefix 'lib/cmake/TBB')"
      - name: Build and test the combined physics vertical slice
        shell: pwsh
        run: |
          Invoke-Expression ((& ost env ${{ matrix.platform }} --profile ${{ matrix.profile }} --shell pwsh) -join "`n")
          $env:CMAKE_PREFIX_PATH = "$env:JOLT_PREFIX;$env:CMAKE_PREFIX_PATH"
          cmake --build build/vertical-slice --config Release
          ctest --test-dir build/vertical-slice -C Release --output-on-failure -R "^stage_runner\.physics_|^stage_runner\.rejects_(non_meter|inherited)_physics"
      - name: Validate the workspace dependency graph
        if: ${{ hashFiles('**/openstrata.plugin.yaml') != '' }}
        shell: bash
        run: ost plugin test --workspace --graph-only --json
      - name: Build the workspace from source
        shell: bash
        run: ost build --target ${{ matrix.platform }} --profile ${{ matrix.profile }}
      - name: Run the workspace test suite
        if: ${{ matrix.verify == 'test' }}
        shell: bash
        run: ost test --target ${{ matrix.platform }} --profile ${{ matrix.profile }}
      - name: Upload the build logs and CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: report-${{ matrix.name }}
          path: |
            .strata/targets/
            .ost-ci/
